<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Visor de modelos — GPU LAB</title>
<link rel="stylesheet" href="../../assets/css/lab.css">
<style>
  .modelos {
    position: absolute;
    left: 24px;
    bottom: 54px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 46vw;
  }
  .modelos button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .5px;
    padding: 7px 12px;
    color: var(--mint);
    background: rgba(4, 12, 9, .78);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: .15s;
  }
  .modelos button:hover { border-color: var(--green); color: #fff; }
  .modelos button.on {
    color: #04120c;
    background: var(--green);
    border-color: var(--green);
    font-weight: 700;
  }
</style>
</head>
<body class="demo">
<canvas id="view"></canvas>

<div class="overlay">
  <div class="tag">
    <div class="num">DEMO 07 · MATERIALES PBR + SOMBRAS</div>
    <h1>Visor de modelos</h1>
    <p>Modelos 3D con materiales <b>PBR</b> (metalicidad / rugosidad), <b>mapas de sombra</b>
       proyectados por la luz y un <b>entorno prefiltrado en la GPU</b> con
       <i>PMREM</i> para que los reflejos sean reales.</p>
  </div>
  <div class="hud" id="hud"></div>
  <div class="modelos" id="modelos">
    <button data-m="0" class="on">Nudo toroidal</button>
    <button data-m="1">Icosaedro</button>
    <button data-m="2">Cristales</button>
    <button data-w="1" class="on">Wireframe</button>
  </div>
  <div class="foot">
    <span class="pill">arrastra para girar</span>
    <span class="pill">rueda para acercar</span>
    <a href="../../index.html">← índice</a>
  </div>
</div>

<script src="../../vendor/three.min.js"></script>
<script src="../../assets/js/lab-core.js"></script>
<script>
/* =====================================================================
   07 · VISOR DE MODELOS
   · MeshStandardMaterial (PBR) iluminado por luz direccional con sombras
     y dos luces de color.
   · Entorno prefiltrado con PMREMGenerator a partir de una escena con
     paneles emisivos: los reflejos se calculan en la GPU.
   · Tres modelos procedurales + superposición de wireframe neón.
   ===================================================================== */
const PERIOD = 24;

LAB.boot({
  name: '07-visor-modelos',
  period: PERIOD,
  frames: 48,
  fov: 42,
  near: 0.1,
  far: 200,
  camera: { pos: [5.5, 4.2, 7.5], target: [0, 1.5, 0] },
  orbitOpts: { minRadius: 3.5, maxRadius: 30, minPolar: 0.25, maxPolar: 1.5 },
  stats: { modelo: '', sombras: '2048²', entorno: 'PMREM' },

  build(ctx) {
    const { scene, renderer, camera } = ctx;

    /* ---------------------------------------------- render con sombras */
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    scene.fog = new THREE.Fog(0x040706, 22, 60);

    /* ---------------------------------------------- entorno PMREM */
    (function entorno() {
      const envScene = new THREE.Scene();

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(30, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0x061410, side: THREE.BackSide })
      );
      envScene.add(dome);

      const panel = (color, x, y, z, w, h) => {
        const p = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color })
        );
        p.position.set(x, y, z);
        p.lookAt(0, 0, 0);
        envScene.add(p);
      };
      panel(0x00ff41, 16, 9, -6, 16, 16);
      panel(0x38bdf8, -14, 5, 9, 14, 14);
      panel(0xffffff, 0, 17, 0, 20, 20);

      const pmrem = new THREE.PMREMGenerator(renderer);
      const rt = pmrem.fromScene(envScene, 0.04);
      scene.environment = rt.texture;
      pmrem.dispose();
    })();

    /* ---------------------------------------------- luces */
    const amb = new THREE.AmbientLight(0x2a6b4c, 0.55);
    scene.add(amb);

    const key = new THREE.DirectionalLight(0xffffff, 2.1);
    key.position.set(6, 11, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 40;
    key.shadow.camera.left = -9;
    key.shadow.camera.right = 9;
    key.shadow.camera.top = 9;
    key.shadow.camera.bottom = -9;
    key.shadow.bias = -0.0006;
    scene.add(key);

    const rim = new THREE.PointLight(0x38bdf8, 26, 26, 2.2);
    rim.position.set(-5.5, 2.4, -5);
    scene.add(rim);

    const fill = new THREE.PointLight(0x00ff41, 22, 24, 2.2);
    fill.position.set(5.2, 1.4, -4.2);
    scene.add(fill);

    /* ---------------------------------------------- suelo */
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(16, 72),
      new THREE.MeshStandardMaterial({ color: 0x061410, metalness: 0.85, roughness: 0.28 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = LAB.grid(34, 34, LAB.PAL.green, 0.16);
    grid.position.y = 0.012;
    scene.add(grid);
    scene.add(LAB.stars(700, 220, 0x9dffc0, 1.0));

    /* ---------------------------------------------- modelos */
    const MAT = [
      { color: 0x0d3d29, metalness: 0.95, roughness: 0.17, emissive: 0x00ff41, emissiveIntensity: 0.28 },
      { color: 0x123a52, metalness: 0.72, roughness: 0.22, emissive: 0x38bdf8, emissiveIntensity: 0.30 },
      { color: 0x0a2c2a, metalness: 0.35, roughness: 0.06, emissive: 0x00ff41, emissiveIntensity: 0.45 }
    ];

    function crearMat(i) {
      return new THREE.MeshStandardMaterial(Object.assign({
        envMapIntensity: 1.35,
        flatShading: i === 1
      }, MAT[i]));
    }

    const modelos = [
      {
        nombre: 'Nudo toroidal',
        build() {
          const g = new THREE.Group();
          const geo = new THREE.TorusKnotGeometry(1.55, 0.42, 250, 40, 2, 3);
          const m = new THREE.Mesh(geo, crearMat(0));
          m.castShadow = true;
          g.add(m);
          const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
            color: 0x9dffc0, wireframe: true, transparent: true, opacity: 0.16,
            blending: THREE.AdditiveBlending, depthWrite: false
          }));
          g.add(wire);
          g.userData.wire = wire;
          g.userData.base = m;
          return g;
        }
      },
      {
        nombre: 'Icosaedro',
        build() {
          const g = new THREE.Group();
          const geo = new THREE.IcosahedronGeometry(1.95, 1);
          const m = new THREE.Mesh(geo, crearMat(1));
          m.castShadow = true;
          g.add(m);

          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(geo),
            new THREE.LineBasicMaterial({
              color: 0x38bdf8, transparent: true, opacity: 0.85,
              blending: THREE.AdditiveBlending, depthWrite: false
            })
          );
          g.add(edges);
          g.userData.wire = edges;
          g.userData.base = m;
          return g;
        }
      },
      {
        nombre: 'Cristales',
        build() {
          const g = new THREE.Group();
          const rand = LAB.rng(4242);
          for (let i = 0; i < 13; i++) {
            const s = 0.55 + rand() * 1.35;
            const geo = new THREE.OctahedronGeometry(s, 0);
            const m = new THREE.Mesh(geo, crearMat(2));
            m.position.set((rand() - 0.5) * 2.6, s * 0.9 + rand() * 0.5, (rand() - 0.5) * 2.6);
            m.rotation.set(rand() * 3, rand() * 3, rand() * 3);
            m.castShadow = true;
            g.add(m);
          }
          const wire = new THREE.Mesh(
            new THREE.OctahedronGeometry(2.65, 0),
            new THREE.MeshBasicMaterial({
              color: 0x00ff41, wireframe: true, transparent: true, opacity: 0.22,
              blending: THREE.AdditiveBlending, depthWrite: false
            })
          );
          wire.position.y = 1.6;
          g.add(wire);
          g.userData.wire = wire;
          g.userData.base = null;
          return g;
        }
      }
    ];

    let activo = null;
    const cont = new THREE.Group();
    scene.add(cont);

    function mostrar(i) {
      if (activo) cont.remove(activo);
      activo = modelos[i].build();
      cont.add(activo);
      ctx.report({
        modelo: modelos[i].nombre,
        sombras: key.shadow.mapSize.x + '²',
        entorno: 'PMREM'
      });
    }

    let idx = 0;
    mostrar(0);

    /* ---------------------------------------------- interfaz */
    const botones = document.querySelectorAll('#modelos button');
    botones.forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.w) {
          const w = activo.userData.wire;
          w.visible = !w.visible;
          b.classList.toggle('on', w.visible);
          return;
        }
        idx = parseInt(b.dataset.m, 10);
        mostrar(idx);
        botones.forEach(o => { if (!o.dataset.w) o.classList.toggle('on', o === b); });
      });
    });

    const ctl = ctx.ctl;

    return {
      update(t) {
        const u = t / PERIOD;

        if (activo) {
          activo.rotation.y = u * Math.PI * 2;
          activo.position.y = Math.sin(u * Math.PI * 4) * 0.12;
        }

        key.position.set(Math.cos(u * Math.PI * 2) * 8, 11, Math.sin(u * Math.PI * 2) * 8);
        rim.position.set(Math.cos(u * Math.PI * 2 + 2.1) * 6, 2.4, Math.sin(u * Math.PI * 2 + 2.1) * 6);
        fill.position.set(Math.cos(u * Math.PI * 2 + 4.2) * 6, 1.3, Math.sin(u * Math.PI * 2 + 4.2) * 6);

        if (ctx.embed && ctl) {
          ctl.set(8.2, u * Math.PI * 2 + 0.9, 1.02 + Math.sin(u * Math.PI * 2) * 0.16);
        }
      }
    };
  }
});
</script>
</body>
</html>
